services:
  application:
    image: ain_com:0.0.1
    container_name: ain_com
    env_file: .env.dev
    environment:
      - DATABASE_URL=postgres://postgres:development@postgres-db/ain_com_dev
    ports:
      - 4000:4000
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:16-alpine
    container_name: ain_com-postgres
    environment:
      - POSTGRES_DB=ain_com_dev
      - POSTGRES_PASSWORD=development
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
